<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.5">
  <title>Генератор мелодических диктантов | Сольфеджио-тренажёр</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 20% 20%, #3b2b5e, #1b1236);
      font-family: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #f5f0ff;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    .header {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.9rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }

    .logo {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #f9d56e, #ffb347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .logo span {
      font-size: 1.9rem;
      filter: drop-shadow(0 0 8px #ffb347);
    }

    .nav {
      display: flex;
      gap: 2rem;
      font-weight: 600;
      flex-wrap: wrap;
    }

    .nav a {
      color: #cfc0f0;
      text-decoration: none;
      padding: 0.3rem 0;
      border-bottom: 2px solid transparent;
      transition: 0.2s ease;
    }

    .nav a:hover {
      border-bottom-color: #ffb347;
      color: #fff;
    }

    .game-container {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
      padding: 1rem 1rem 2rem;
    }

    /* Человечек в левом верхнем углу */
    .listener-corner {
      position: absolute;
      top: 0.5rem;
      left: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      cursor: pointer;
      z-index: 5;
      transition: transform 0.2s;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.4));
    }

    .listener-corner:hover {
      transform: scale(1.05);
    }

    .listener-corner:active {
      transform: scale(0.96);
    }

    .listener-avatar {
      font-size: 4rem;
      line-height: 1;
      animation: gentleBob 2s infinite alternate ease-in-out;
    }

    @keyframes gentleBob {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    .listener-label {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      color: #ffe5b4;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.3rem 1rem;
      border-radius: 30px;
      white-space: nowrap;
      border: 1px solid rgba(255, 200, 100, 0.4);
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    /* Кнопка Подсказка (показ тоники) */
    .hint-btn {
      position: absolute;
      bottom: 0.8rem;
      right: 0.8rem;
      background: #f9d56e;
      border: none;
      border-radius: 40px;
      padding: 0.6rem 1.5rem;
      font-weight: 700;
      font-size: 1rem;
      color: #1b1236;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      z-index: 6;
      transition: 0.2s;
      border: 2px solid #ffb347;
    }

    .hint-btn:hover {
      background: #ffe8a1;
      transform: translateY(-3px);
    }

    .hint-btn:active {
      transform: translateY(1px);
    }

    /* Облака как декорация */
    .cloud-area {
      position: relative;
      width: 300px;
      height: 160px;
      margin: 2rem auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cloud {
      position: absolute;
      background: #ffffff;
      border-radius: 80% 20% 70% 30% / 60% 50% 50% 40%;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.4), inset 0 -8px 12px rgba(0, 0, 0, 0.1);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .cloud::after,
    .cloud::before {
      content: '';
      position: absolute;
      background: inherit;
      border-radius: inherit;
    }

    .cloud1 {
      width: 140px;
      height: 75px;
      top: 10px;
      left: 20px;
      z-index: 2;
      animation: floatCloud 5s infinite alternate ease-in-out;
    }

    .cloud2 {
      width: 120px;
      height: 65px;
      bottom: 5px;
      right: 10px;
      z-index: 2;
      animation: floatCloud 6s infinite alternate-reverse ease-in-out;
    }

    .cloud3 {
      width: 100px;
      height: 55px;
      top: 50px;
      right: 40px;
      z-index: 1;
      opacity: 0.9;
      animation: floatCloud 7s infinite alternate ease-in-out;
    }

    @keyframes floatCloud {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-15px) scale(1.04); }
    }

    .cloud-label {
      font-size: 2rem;
      font-weight: bold;
      color: #ffd966;
      text-shadow: 0 8px 15px rgba(0,0,0,0.5);
      z-index: 3;
    }

    /* Настройки */
    .settings {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: center;
      margin: 0.5rem 0;
      background: rgba(0,0,0,0.3);
      padding: 1rem;
      border-radius: 2rem;
    }

    .settings label {
      font-weight: 600;
      margin-right: 0.3rem;
    }

    .settings select {
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      background: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-create {
      background: #ffb347;
      border: none;
      color: #1b1236;
      font-weight: bold;
      padding: 0.7rem 2rem;
      border-radius: 3rem;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 12px 18px rgba(0,0,0,0.3);
      transition: 0.2s;
    }

    .btn-create:hover {
      background: #ffc164;
      transform: translateY(-2px);
    }

    /* Нотный стан (SVG) */
    .staff-container {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 1.5rem;
      padding: 1rem;
      margin: 1rem 0;
      display: flex;
      justify-content: center;
      width: 100%;
      overflow-x: auto;
    }

    .staff-svg {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 0.5rem;
    }

    /* Клавиатура */
    .piano-wrapper {
      background: #2a213a;
      padding: 1.5rem 0.8rem 1rem;
      border-radius: 2.5rem;
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.6), inset 0 0 12px rgba(255, 255, 255, 0.1);
      margin: 1rem 0 0.8rem;
      width: 100%;
      position: relative;
    }

    .piano {
      display: flex;
      position: relative;
      height: 160px;
      justify-content: center;
      width: 100%;
    }

    .white-key {
      flex: 1 1 0;
      background: linear-gradient(180deg, #fefcf5 0%, #e8e0d5 100%);
      border-radius: 0 0 14px 14px;
      margin: 0 1px;
      box-shadow: 0 8px 0 #b7a99a, 0 10px 12px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 10px;
      font-weight: bold;
      color: #3b3347;
      font-size: 1rem;
      transition: all 0.08s ease;
      position: relative;
      z-index: 2;
      min-width: 0;
    }

    .white-key:active,
    .white-key.pressed {
      box-shadow: 0 3px 0 #b7a99a, 0 6px 8px rgba(0, 0, 0, 0.3);
      background: #f3e9da;
      transform: translateY(5px);
    }

    .white-key.active-note {
      background: #ffb74d !important;
      box-shadow: 0 0 25px #ff9100;
      transform: scale(1.02);
    }

    .black-key.active-note {
      background: #ff6d00 !important;
      box-shadow: 0 0 25px #ff9100;
    }

    .black-key {
      position: absolute;
      width: 7%;
      height: 60%;
      background: linear-gradient(180deg, #2f2f3a 0%, #0f0f14 100%);
      border-radius: 0 0 8px 8px;
      box-shadow: 0 6px 0 #050507, 0 8px 10px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      z-index: 3;
      transition: all 0.08s ease;
      min-width: 30px;
    }

    .black-key:active,
    .black-key.pressed {
      box-shadow: 0 2px 0 #050507, 0 4px 6px rgba(0, 0, 0, 0.5);
      transform: translateY(4px);
      background: #3d3d4a;
    }

    .piano-labels {
      text-align: center;
      margin-top: 0.8rem;
      font-size: 0.8rem;
      color: #b9adcc;
    }

    /* Кнопки управления */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin: 0.5rem 0;
    }

    .btn-action {
      background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,200,100,0.4);
      border-radius: 3rem;
      padding: 0.7rem 1.8rem;
      font-weight: 700;
      font-size: 1rem;
      color: #f5f0ff;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: 0.2s;
    }

    .btn-action:hover {
      background: rgba(255,255,255,0.25);
      border-color: #ffb347;
      transform: translateY(-2px);
    }

    .btn-action:disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .answer-box {
      background: rgba(0,0,0,0.5);
      padding: 1rem 2rem;
      border-radius: 2rem;
      margin: 0.5rem;
      font-size: 1.2rem;
      font-weight: 600;
      min-height: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .info-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.8rem;
      width: 100%;
    }

    .hint-text {
      background: rgba(0, 0, 0, 0.4);
      padding: 0.6rem 1.8rem;
      border-radius: 40px;
      font-size: 1.1rem;
      font-weight: 600;
      backdrop-filter: blur(8px);
      color: #ffe5b4;
      border: 1px solid rgba(255, 200, 100, 0.3);
    }

    @media (max-width: 650px) {
      .listener-corner {
        top: 0.2rem;
        left: 0.3rem;
      }
      .listener-avatar {
        font-size: 3rem;
      }
      .listener-label {
        font-size: 0.7rem;
        padding: 0.2rem 0.7rem;
      }
      .hint-btn {
        padding: 0.4rem 1.2rem;
        font-size: 0.8rem;
        bottom: 0.5rem;
        right: 0.5rem;
      }
      .cloud-area {
        width: 240px;
        height: 130px;
      }
      .white-key { font-size: 0.7rem; padding-bottom: 4px; }
      .piano { height: 130px; }
      .black-key { width: 8%; }
    }

    @media (max-width: 400px) {
      .piano { height: 110px; }
      .white-key { font-size: 0.6rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <span>🎼</span> Сольфеджио-тренажёр
    </div>
    <nav class="nav">
      <a href="#">Главная</a>
      <a href="#">Тренажёры</a>
      <a href="#">Статьи</a>
      <a href="#">О проекте</a>
    </nav>
  </header>

  <div class="game-container">
    <div class="listener-corner" id="listenerCorner">
      <div class="listener-avatar">🧑‍🎤</div>
      <div class="listener-label">Прослушать диктант</div>
    </div>

    <button class="hint-btn" id="hintBtn">💡 Тоника</button>

    <div class="cloud-area" id="cloudArea">
      <div class="cloud cloud1"></div>
      <div class="cloud cloud2"></div>
      <div class="cloud cloud3"></div>
      <div class="cloud-label">🎵 Диктант</div>
    </div>

    <div class="settings">
      <label>Тональность:</label>
      <select id="tonalitySelect">
        <option value="C">До мажор</option>
        <option value="A">Ля минор</option>
      </select>
      <label>Размер:</label>
      <select id="timeSelect">
        <option value="4">4/4</option>
        <option value="3">3/4</option>
        <option value="2">2/4</option>
      </select>
      <label>Тактов:</label>
      <select id="barsSelect">
        <option value="2">2</option>
        <option value="1">1</option>
        <option value="3">3</option>
        <option value="4">4</option>
      </select>
      <button class="btn-create" id="createBtn">✨ Создать диктант</button>
    </div>

    <!-- Нотный стан (SVG) для отображения ответа -->
    <div class="staff-container" id="staffContainer" style="display: none;">
      <svg id="staffSvg" class="staff-svg" width="600" height="150" viewBox="0 0 600 150"></svg>
    </div>

    <div class="piano-wrapper">
      <div class="piano" id="piano"></div>
      <div class="piano-labels" id="pianoLabels"></div>
    </div>

    <div class="controls">
      <button class="btn-action" id="playBtn" disabled>▶️ Прослушать (3 раза)</button>
      <button class="btn-action" id="showAnswerBtn" disabled>👁️ Показать ответ</button>
      <button class="btn-action" id="hideAnswerBtn" disabled style="display:none;">🙈 Скрыть ответ</button>
    </div>

    <div class="answer-box" id="answerBox">Ответ пока не создан</div>
    <div class="info-area">
      <div class="hint-text" id="hintText">🎯 Настрой и нажми «Создать диктант»</div>
    </div>
  </div>

  <script>
    (function() {
      // Все ноты (две октавы: от До4 до Си5)
      const NOTES = [
        { name: 'До', octave: 4, freq: 261.63, key: 'C4', isBlack: false },
        { name: 'До♯', octave: 4, freq: 277.18, key: 'C#4', isBlack: true },
        { name: 'Ре', octave: 4, freq: 293.66, key: 'D4', isBlack: false },
        { name: 'Ре♯', octave: 4, freq: 311.13, key: 'D#4', isBlack: true },
        { name: 'Ми', octave: 4, freq: 329.63, key: 'E4', isBlack: false },
        { name: 'Фа', octave: 4, freq: 349.23, key: 'F4', isBlack: false },
        { name: 'Фа♯', octave: 4, freq: 369.99, key: 'F#4', isBlack: true },
        { name: 'Соль', octave: 4, freq: 392.00, key: 'G4', isBlack: false },
        { name: 'Соль♯', octave: 4, freq: 415.30, key: 'G#4', isBlack: true },
        { name: 'Ля', octave: 4, freq: 440.00, key: 'A4', isBlack: false },
        { name: 'Ля♯', octave: 4, freq: 466.16, key: 'A#4', isBlack: true },
        { name: 'Си', octave: 4, freq: 493.88, key: 'B4', isBlack: false },
        { name: 'До', octave: 5, freq: 523.25, key: 'C5', isBlack: false },
        { name: 'До♯', octave: 5, freq: 554.37, key: 'C#5', isBlack: true },
        { name: 'Ре', octave: 5, freq: 587.33, key: 'D5', isBlack: false },
        { name: 'Ре♯', octave: 5, freq: 622.25, key: 'D#5', isBlack: true },
        { name: 'Ми', octave: 5, freq: 659.25, key: 'E5', isBlack: false },
        { name: 'Фа', octave: 5, freq: 698.46, key: 'F5', isBlack: false },
        { name: 'Фа♯', octave: 5, freq: 739.99, key: 'F#5', isBlack: true },
        { name: 'Соль', octave: 5, freq: 783.99, key: 'G5', isBlack: false },
        { name: 'Соль♯', octave: 5, freq: 830.61, key: 'G#5', isBlack: true },
        { name: 'Ля', octave: 5, freq: 880.00, key: 'A5', isBlack: false },
        { name: 'Ля♯', octave: 5, freq: 932.33, key: 'A#5', isBlack: true },
        { name: 'Си', octave: 5, freq: 987.77, key: 'B5', isBlack: false }
      ];

      const pianoContainer = document.getElementById('piano');
      const labelsContainer = document.getElementById('pianoLabels');
      const hintText = document.getElementById('hintText');
      const answerBox = document.getElementById('answerBox');
      const createBtn = document.getElementById('createBtn');
      const playBtn = document.getElementById('playBtn');
      const showAnswerBtn = document.getElementById('showAnswerBtn');
      const hideAnswerBtn = document.getElementById('hideAnswerBtn');
      const hintBtn = document.getElementById('hintBtn');
      const listenerCorner = document.getElementById('listenerCorner');
      const staffContainer = document.getElementById('staffContainer');
      const staffSvg = document.getElementById('staffSvg');

      const tonalitySelect = document.getElementById('tonalitySelect');
      const timeSelect = document.getElementById('timeSelect');
      const barsSelect = document.getElementById('barsSelect');

      let currentMelody = [];
      let isPlaying = false;
      let audioCtx = null;
      let melodyAnswer = '';

      // ---------- Аудио ----------
      function getAudioContext() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playFrequency(freq, duration = 0.5, when = 0) {
        const ctx = getAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + when);
        gain.gain.setValueAtTime(0, ctx.currentTime + when);
        gain.gain.linearRampToValueAtTime(0.6, ctx.currentTime + when + 0.05);
        gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + when + 0.2);
        gain.gain.linearRampToValueAtTime(0, ctx.currentTime + when + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + when);
        osc.stop(ctx.currentTime + when + duration + 0.05);
      }

      function clearActiveNote() {
        document.querySelectorAll('.active-note').forEach(el => el.classList.remove('active-note'));
      }

      function highlightNote(noteIndex) {
        clearActiveNote();
        const el = document.querySelector(`[data-note-index="${noteIndex}"]`);
        if (el) el.classList.add('active-note');
      }

      async function playMelodyWithHighlight(melody) {
        if (isPlaying) return;
        isPlaying = true;
        playBtn.disabled = true;
        const noteDuration = 0.5;
        for (let repeat = 0; repeat < 3; repeat++) {
          for (let i = 0; i < melody.length; i++) {
            const note = melody[i];
            const idx = NOTES.indexOf(note);
            playFrequency(note.freq, noteDuration);
            highlightNote(idx);
            await new Promise(res => setTimeout(res, noteDuration * 1000));
            clearActiveNote();
            if (i < melody.length - 1 || repeat < 2) {
              await new Promise(res => setTimeout(res, 300));
            }
          }
          if (repeat < 2) {
            await new Promise(res => setTimeout(res, 1500));
          }
        }
        isPlaying = false;
        playBtn.disabled = false;
      }

      // ---------- Нотный стан (SVG) ----------
      const staffTop = 30;
      const staffSpacing = 12;
      const noteRadius = 6;

      // Позиция ноты на стане (скрипичный ключ)
      function getNoteYPosition(note) {
        const noteNames = {
          'До': 6, 'Ре': 5, 'Ми': 4, 'Фа': 3, 'Соль': 2, 'Ля': 1, 'Си': 0
        };
        // Базовое имя без диеза
        let baseName = note.name.replace('♯', '').replace('♯', '');
        if (!noteNames.hasOwnProperty(baseName)) return 0;
        let offset = noteNames[baseName];
        // Октава 4: смещение на 0 (относительно середины)
        // Октава 5: на 7 позиций выше (меньше Y)
        const octaveOffset = (note.octave - 4) * 7;
        offset += octaveOffset;
        // Преобразуем в Y: каждая позиция = staffSpacing/2
        return staffTop - offset * (staffSpacing / 2);
      }

      function drawStaff(svg, melody) {
        svg.innerHTML = '';
        const width = svg.getAttribute('width') || 600;
        const height = svg.getAttribute('height') || 150;

        // Рисуем пять линий
        for (let i = 0; i < 5; i++) {
          const y = staffTop + i * staffSpacing;
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', 40);
          line.setAttribute('y1', y);
          line.setAttribute('x2', width - 20);
          line.setAttribute('y2', y);
          line.setAttribute('stroke', '#f5f0ff');
          line.setAttribute('stroke-width', 1);
          svg.appendChild(line);
        }

        // Скрипичный ключ (упрощённый символ)
        const clef = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        clef.setAttribute('x', 10);
        clef.setAttribute('y', staffTop + staffSpacing * 2.5);
        clef.setAttribute('font-size', '32');
        clef.setAttribute('fill', '#f5f0ff');
        clef.setAttribute('font-family', 'serif');
        clef.textContent = '𝄞';
        svg.appendChild(clef);

        // Ноты
        const stepX = (width - 100) / Math.max(melody.length - 1, 1);
        melody.forEach((note, index) => {
          const cx = 70 + index * stepX;
          const cy = getNoteYPosition(note);
          // Овальная нота
          const ellipse = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
          ellipse.setAttribute('cx', cx);
          ellipse.setAttribute('cy', cy);
          ellipse.setAttribute('rx', noteRadius);
          ellipse.setAttribute('ry', noteRadius * 0.8);
          ellipse.setAttribute('fill', '#ffd966');
          svg.appendChild(ellipse);

          // Знак альтерации (диез)
          if (note.isBlack) {
            const accidental = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            accidental.setAttribute('x', cx - 14);
            accidental.setAttribute('y', cy - 10);
            accidental.setAttribute('font-size', '16');
            accidental.setAttribute('fill', '#ffd966');
            accidental.setAttribute('font-weight', 'bold');
            accidental.textContent = '♯';
            svg.appendChild(accidental);
          }

          // Название ноты под станом
          const nameLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          nameLabel.setAttribute('x', cx);
          nameLabel.setAttribute('y', staffTop + staffSpacing * 4 + 20);
          nameLabel.setAttribute('text-anchor', 'middle');
          nameLabel.setAttribute('font-size', '12');
          nameLabel.setAttribute('fill', '#ffd966');
          nameLabel.textContent = note.name.replace('♯', '♯');
          svg.appendChild(nameLabel);
        });
      }

      function showStaff(melody) {
        staffContainer.style.display = 'flex';
        drawStaff(staffSvg, melody);
      }

      function hideStaff() {
        staffContainer.style.display = 'none';
      }

      // ---------- Генерация мелодии ----------
      function getScale(tonality) {
        const whiteIndices = NOTES.map((n, idx) => n.isBlack ? -1 : idx).filter(idx => idx !== -1);
        const tonicKey = tonality === 'C' ? 'C4' : 'A4';
        const tonicIndex = NOTES.findIndex(n => n.key === tonicKey);
        return { tonicIndex, whiteIndices };
      }

      function generateMelody(tonality, bars, beatsPerBar) {
        const { tonicIndex, whiteIndices } = getScale(tonality);
        const totalNotes = bars * beatsPerBar;
        const melody = [];
        let currentIndex = tonicIndex;
        melody.push(NOTES[currentIndex]);
        for (let i = 1; i < totalNotes - 1; i++) {
          const possibleMoves = [];
          const currentPos = whiteIndices.indexOf(currentIndex);
          if (currentPos > 0) possibleMoves.push(whiteIndices[currentPos - 1]);
          if (currentPos < whiteIndices.length - 1) possibleMoves.push(whiteIndices[currentPos + 1]);
          if (currentPos > 1) possibleMoves.push(whiteIndices[currentPos - 2]);
          if (currentPos < whiteIndices.length - 2) possibleMoves.push(whiteIndices[currentPos + 2]);
          const nextIndex = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
          melody.push(NOTES[nextIndex]);
          currentIndex = nextIndex;
        }
        melody.push(NOTES[tonicIndex]);
        return melody;
      }

      function createDictation() {
        const tonality = tonalitySelect.value;
        const beats = parseInt(timeSelect.value);
        const bars = parseInt(barsSelect.value);
        currentMelody = generateMelody(tonality, bars, beats);
        melodyAnswer = currentMelody.map(n => n.name.replace('♯','♯')).join(' → ');
        answerBox.textContent = 'Ответ скрыт';
        playBtn.disabled = false;
        showAnswerBtn.disabled = false;
        hideAnswerBtn.style.display = 'none';
        showAnswerBtn.style.display = 'inline-block';
        hideStaff();
        hintText.textContent = '🎯 Нажми «Прослушать» или покажи ответ';
      }

      function showAnswer() {
        answerBox.textContent = melodyAnswer;
        showAnswerBtn.style.display = 'none';
        hideAnswerBtn.style.display = 'inline-block';
        showStaff(currentMelody);
      }

      function hideAnswer() {
        answerBox.textContent = 'Ответ скрыт';
        showAnswerBtn.style.display = 'inline-block';
        hideAnswerBtn.style.display = 'none';
        hideStaff();
      }

      // ---------- Клавиатура ----------
      function renderPiano() {
        pianoContainer.innerHTML = '';
        const whiteKeysData = NOTES.filter(n => !n.isBlack);
        whiteKeysData.forEach(note => {
          const keyDiv = document.createElement('div');
          keyDiv.className = 'white-key';
          keyDiv.dataset.noteIndex = NOTES.indexOf(note);
          keyDiv.textContent = note.name;
          keyDiv.addEventListener('click', () => {
            if (!isPlaying) playFrequency(note.freq, 0.3);
          });
          pianoContainer.appendChild(keyDiv);
        });

        const blackPositions = {
          'C#4': 0, 'D#4': 1, 'F#4': 3, 'G#4': 4, 'A#4': 5,
          'C#5': 7, 'D#5': 8, 'F#5': 10, 'G#5': 11, 'A#5': 12
        };
        const whiteKeyElements = document.querySelectorAll('.white-key');
        NOTES.filter(n => n.isBlack).forEach(note => {
          const posIndex = blackPositions[note.key];
          if (posIndex !== undefined && whiteKeyElements[posIndex]) {
            const whiteKey = whiteKeyElements[posIndex];
            const blackKey = document.createElement('div');
            blackKey.className = 'black-key';
            blackKey.dataset.noteIndex = NOTES.indexOf(note);
            blackKey.addEventListener('click', (e) => {
              e.stopPropagation();
              if (!isPlaying) playFrequency(note.freq, 0.3);
            });
            pianoContainer.appendChild(blackKey);
            positionBlackKey(blackKey, whiteKey);
          }
        });

        labelsContainer.textContent = 'До малой октавы – Си второй октавы';
      }

      function positionBlackKey(blackKey, whiteKey) {
        const whiteRect = whiteKey.getBoundingClientRect();
        const pianoRect = pianoContainer.getBoundingClientRect();
        const leftOffset = whiteRect.left - pianoRect.left + whiteRect.width * 0.7;
        blackKey.style.left = `${leftOffset}px`;
        blackKey.style.width = `${whiteRect.width * 0.55}px`;
      }

      function repositionAllBlackKeys() {
        const blackKeys = document.querySelectorAll('.black-key');
        const whiteKeyElements = document.querySelectorAll('.white-key');
        const blackPositions = {
          'C#4': 0, 'D#4': 1, 'F#4': 3, 'G#4': 4, 'A#4': 5,
          'C#5': 7, 'D#5': 8, 'F#5': 10, 'G#5': 11, 'A#5': 12
        };
        blackKeys.forEach(key => {
          const noteIndex = parseInt(key.dataset.noteIndex);
          const note = NOTES[noteIndex];
          const posIndex = blackPositions[note.key];
          if (posIndex !== undefined && whiteKeyElements[posIndex]) {
            positionBlackKey(key, whiteKeyElements[posIndex]);
          }
        });
      }

      window.addEventListener('resize', repositionAllBlackKeys);

      // ---------- Обработчики ----------
      function showTonicHint() {
        if (!currentMelody.length) {
          hintText.textContent = '🎯 Сначала создайте диктант';
          return;
        }
        const tonic = currentMelody[0];
        hintText.textContent = `💡 Тоника: ${tonic.name.replace('♯','♯')}`;
        const idx = NOTES.indexOf(tonic);
        if (idx) highlightNote(idx);
        setTimeout(clearActiveNote, 2000);
      }

      function init() {
        renderPiano();
        createBtn.addEventListener('click', createDictation);
        playBtn.addEventListener('click', () => {
          if (currentMelody.length) playMelodyWithHighlight(currentMelody);
        });
        showAnswerBtn.addEventListener('click', showAnswer);
        hideAnswerBtn.addEventListener('click', hideAnswer);
        hintBtn.addEventListener('click', showTonicHint);
        listenerCorner.addEventListener('click', () => {
          if (currentMelody.length) playMelodyWithHighlight(currentMelody);
          else hintText.textContent = '🎯 Сначала создайте диктант';
        });
        setTimeout(repositionAllBlackKeys, 100);
        createDictation();
      }

      init();
    })();
  </script>
</body>
</html>
