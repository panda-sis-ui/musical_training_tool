<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.5">
  <title>Теория | Сольфеджио-тренажёр</title>
  <style>
    /* --- Базовые стили (оставлены без изменений) --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 20% 20%, #3b2b5e, #1b1236);
      font-family: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: #f5f0ff;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    .header {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.9rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }

    .logo {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #f9d56e, #ffb347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .logo span {
      font-size: 1.9rem;
      filter: drop-shadow(0 0 8px #ffb347);
    }

    .nav {
      display: flex;
      gap: 2rem;
      font-weight: 600;
      flex-wrap: wrap;
    }

    .nav a {
      color: #cfc0f0;
      text-decoration: none;
      padding: 0.3rem 0;
      border-bottom: 2px solid transparent;
      transition: 0.2s ease;
    }

    .nav a:hover {
      border-bottom-color: #ffb347;
      color: #fff;
    }

    .main-container {
      flex: 1;
      display: flex;
      width: 100%;
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      gap: 1rem;
    }

    .sidebar {
      width: 280px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      border-radius: 2rem;
      padding: 1.5rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      height: fit-content;
      max-height: 80vh;
      overflow-y: auto;
    }

    .sidebar h2 {
      font-size: 1.4rem;
      margin-bottom: 1.2rem;
      color: #ffd966;
      text-align: center;
    }

    .article-list {
      list-style: none;
    }

    .article-item {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      padding: 0.8rem 1rem;
      margin-bottom: 0.3rem;
      border-radius: 1.5rem;
      cursor: pointer;
      transition: 0.2s;
      font-weight: 600;
      color: #cfc0f0;
    }

    .article-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .article-item.active {
      background: rgba(255, 180, 70, 0.25);
      color: #fff;
      border: 1px solid #ffb347;
    }

    .article-icon {
      font-size: 1.5rem;
    }

    .content {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      border-radius: 2rem;
      padding: 2rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow-y: auto;
      max-height: 80vh;
    }

    .article-title {
      font-size: 2rem;
      color: #ffd966;
      margin-bottom: 1.5rem;
    }

    .article-body {
      line-height: 1.7;
      font-size: 1.1rem;
    }

    .article-body p {
      margin-bottom: 1rem;
    }

    .interactive-block {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
      padding: 1rem;
      background: rgba(0,0,0,0.3);
      border-radius: 1.5rem;
      flex-wrap: wrap;
    }

    .note-btn {
      background: #ffb347;
      border: none;
      border-radius: 2rem;
      padding: 0.6rem 1.5rem;
      font-weight: 700;
      cursor: pointer;
      color: #1b1236;
      font-size: 1rem;
      transition: 0.2s;
      border: 2px solid transparent;
    }

    .note-btn:hover {
      background: #ffc164;
      transform: scale(1.03);
    }

    .note-btn:active {
      transform: scale(0.95);
    }

    /* --- НОВЫЕ СТИЛИ ДЛЯ ПИАНИНО И ИГР --- */

    #piano-container {
      margin: 1.5rem 0;
      overflow-x: auto;
      text-align: center;
      padding: 0.5rem 0;
    }

    .piano {
      display: flex;
      position: relative;
      height: 210px;
      width: fit-content;
      margin: 0 auto;
      background: #2a1f3d;
      padding: 15px 8px 8px 8px;
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }

    .white-key {
      width: 50px;
      height: 170px;
      background: #f4f0e6;
      border: 1px solid #bbb;
      border-radius: 0 0 8px 8px;
      cursor: pointer;
      margin: 0 1px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
      color: #333;
      user-select: none;
      transition: background 0.1s, transform 0.05s;
      box-shadow: inset 0 -3px 0 #ccc;
      gap: 2px;
    }

    .white-key .note-label {
      font-size: 15px;
    }
    .white-key .note-emoji {
      font-size: 18px;
      line-height: 1;
    }

    .white-key:active {
      transform: scale(0.98);
      background: #d4e0ff;
    }
    .white-key.active {
      background: #d4e0ff;
    }
    .white-key.highlight-correct {
      background: #6fcf97 !important;
      box-shadow: 0 0 15px #6fcf97;
    }
    .white-key.highlight-wrong {
      background: #eb5757 !important;
      box-shadow: 0 0 15px #eb5757;
    }

    .black-key {
      width: 34px;
      height: 110px;
      background: #1a1a1a;
      border: 1px solid #000;
      border-radius: 0 0 6px 6px;
      cursor: pointer;
      position: relative;
      z-index: 2;
      margin-left: -17px;
      margin-right: -17px;
      margin-top: -32px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
      font-size: 12px;
      font-weight: bold;
      color: #ddd;
      user-select: none;
      transition: background 0.1s, transform 0.05s;
      box-shadow: inset 0 -2px 0 #444;
    }

    .black-key:active {
      transform: scale(0.95);
      background: #555;
    }
    .black-key.active {
      background: #666;
    }

    /* Игровой блок */
    #game-section {
      margin: 1.8rem 0;
      background: rgba(0,0,0,0.35);
      border-radius: 1.5rem;
      padding: 1.5rem;
    }

    .game-tabs {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-bottom: 1.2rem;
    }

    .game-tab {
      background: transparent;
      border: 2px solid #5a4a7a;
      border-radius: 2rem;
      padding: 0.5rem 1.8rem;
      font-weight: 700;
      font-size: 1rem;
      color: #cfc0f0;
      cursor: pointer;
      transition: 0.2s;
    }
    .game-tab.active {
      border-color: #ffb347;
      background: rgba(255, 180, 70, 0.2);
      color: #fff;
    }
    .game-tab:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .game-panel {
      display: none;
      text-align: center;
    }
    .game-panel.active {
      display: block;
    }

    .game-title {
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
      color: #ffd966;
    }

    .game-btn {
      background: #6c5b9e;
      color: #fff;
      border: none;
      padding: 0.8rem 2rem;
      border-radius: 3rem;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 4px 0 #3b2b5e;
      margin: 0.5rem 0;
    }
    .game-btn:hover {
      background: #7f6bb3;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #3b2b5e;
    }
    .game-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #3b2b5e;
    }
    .game-btn:disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .game-options {
      display: flex;
      gap: 0.8rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 1rem;
    }

    .game-option {
      background: #2a1f3d;
      border: 3px solid #5a4a7a;
      border-radius: 2rem;
      padding: 0.6rem 1.8rem;
      font-weight: 700;
      font-size: 1.1rem;
      color: #f5f0ff;
      cursor: pointer;
      transition: 0.15s;
      min-width: 80px;
    }
    .game-option:hover {
      background: #3b2b5e;
      border-color: #ffb347;
      transform: scale(1.05);
    }
    .game-option:active {
      transform: scale(0.95);
    }
    .game-option.correct {
      border-color: #6fcf97;
      background: #27ae60;
      color: #fff;
    }
    .game-option.wrong {
      border-color: #eb5757;
      background: #c0392b;
      color: #fff;
    }
    .game-option.disabled {
      opacity: 0.6;
      pointer-events: none;
    }

    #game-feedback {
      margin-top: 1rem;
      font-size: 1.2rem;
      font-weight: bold;
      min-height: 2.5rem;
    }

    #game-score {
      margin-top: 0.8rem;
      font-size: 1.1rem;
      color: #cfc0f0;
    }

    .memory-prompt {
      font-size: 2rem;
      font-weight: bold;
      background: rgba(255, 215, 0, 0.15);
      padding: 0.6rem 2rem;
      border-radius: 2rem;
      display: inline-block;
      margin: 0.5rem 0;
    }
    .memory-prompt .emoji-big {
      font-size: 2.8rem;
      margin-right: 0.5rem;
    }

    /* Адаптив */
    @media (max-width: 700px) {
      .main-container {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        max-height: none;
      }
      .content {
        max-height: none;
        padding: 1.2rem;
      }
      .white-key {
        width: 36px;
        height: 130px;
        font-size: 11px;
        padding-bottom: 5px;
      }
      .white-key .note-label { font-size: 12px; }
      .white-key .note-emoji { font-size: 14px; }
      .black-key {
        width: 24px;
        height: 80px;
        margin-left: -12px;
        margin-right: -12px;
        margin-top: -24px;
        font-size: 10px;
        padding-bottom: 5px;
      }
      .piano {
        height: 150px;
        padding: 10px 5px 5px 5px;
      }
      .game-option {
        min-width: 60px;
        padding: 0.5rem 1rem;
        font-size: 1rem;
      }
      .game-tab {
        font-size: 0.9rem;
        padding: 0.4rem 1.2rem;
      }
    }

    @media (max-width: 480px) {
      .white-key {
        width: 28px;
        height: 100px;
        font-size: 9px;
        padding-bottom: 3px;
      }
      .white-key .note-label { font-size: 10px; }
      .white-key .note-emoji { font-size: 12px; }
      .black-key {
        width: 18px;
        height: 60px;
        margin-left: -9px;
        margin-right: -9px;
        margin-top: -18px;
        font-size: 8px;
        padding-bottom: 3px;
      }
      .piano {
        height: 120px;
        padding: 8px 3px 3px 3px;
      }
      .memory-prompt { font-size: 1.5rem; }
      .memory-prompt .emoji-big { font-size: 2rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <span>🎼</span> Сольфеджио-тренажёр
    </div>
    <nav class="nav">
      <a href="#">Главная</a>
      <a href="#">Тренажёры</a>
      <a href="#">Статьи</a>
      <a href="#">О проекте</a>
    </nav>
  </header>

  <div class="main-container">
    <aside class="sidebar">
      <h2>📚 Статьи</h2>
      <ul class="article-list" id="articleList"></ul>
    </aside>

    <main class="content" id="articleContent">
      <h2 class="article-title">Выберите статью</h2>
      <p class="article-body">👈 Нажмите на тему слева, чтобы начать изучение.</p>
    </main>
  </div>

  <script>
    (function() {
      // ---- Статьи (обновлена только статья о нотах) ----
      const articles = [
        {
          id: 'notes',
          title: 'Ноты и их расположение',
          icon: '🎵',
          content: `
            <p>🎹 <strong>Привет, юный музыкант!</strong> В музыке всего <strong>семь основных нот</strong>: <span style="color:#ffd966;">До, Ре, Ми, Фа, Соль, Ля, Си</span>. Они повторяются в разных октавах – от низких звуков к высоким.</p>
            <p>👀 Чтобы легче запомнить названия, придумай для каждой ноты свой образ:</p>
            <div style="display:flex; flex-wrap:wrap; gap:0.5rem 1.2rem; justify-content:center; background:rgba(255,255,255,0.05); border-radius:1.5rem; padding:0.8rem; margin:1rem 0;">
              <span><strong>🏠 До</strong> – домик</span>
              <span><strong>🌊 Ре</strong> – река</span>
              <span><strong>🐻 Ми</strong> – мишка</span>
              <span><strong>🔦 Фа</strong> – фонарь</span>
              <span><strong>☀️ Соль</strong> – солнце</span>
              <span><strong>🐸 Ля</strong> – лягушка</span>
              <span><strong>🐦 Си</strong> – синица</span>
            </div>
            <p>🔊 Нажимай на клавиши пианино ниже – услышишь звук каждой ноты и увидишь её образ. Это поможет связать звук, название и картинку!</p>

            <div id="piano-container"></div>

            <p>📝 На нотном стане (пять линеек) каждая нота пишется на своей линии или между ними. Например, <strong>До</strong> – на добавочной линейке снизу, а <strong>Соль</strong> – на второй линейке.</p>

            <div id="game-section">
              <div class="game-tabs">
                <button class="game-tab active" data-game="ear">🎧 Угадай по звуку</button>
                <button class="game-tab" data-game="memory">🧠 Найди ноту</button>
              </div>

              <!-- Игра 1: Угадай по звуку -->
              <div id="game-ear" class="game-panel active">
                <div class="game-title">🎵 Угадай ноту по звуку</div>
                <button class="game-btn" id="play-random-note">🎲 Сыграть случайную ноту</button>
                <div id="ear-options" class="game-options"></div>
                <div id="ear-feedback" class="game-feedback"></div>
                <div id="ear-score" class="game-score">✅ Правильных: 0 / 0</div>
              </div>

              <!-- Игра 2: Найди ноту на клавиатуре -->
              <div id="game-memory" class="game-panel">
                <div class="game-title">🧠 Найди ноту на клавиатуре</div>
                <div id="memory-prompt" class="memory-prompt">🎯 Нажми «Показать ноту»</div>
                <button class="game-btn" id="memory-show">🔍 Показать ноту</button>
                <div id="memory-feedback" class="game-feedback"></div>
                <div id="memory-score" class="game-score">✅ Правильных: 0 / 0</div>
              </div>
            </div>

            <p style="margin-top:1rem;">✨ Попробуй также другие статьи – там ты узнаешь про интервалы и знаки альтерации!</p>
          `
        },
        {
          id: 'intervals',
          title: 'Что такое интервал?',
          icon: '🎹',
          content: `
            <p><strong>Интервал</strong> — это расстояние между двумя нотами. Измеряется в полутонах и имеет своё название: прима, секунда, терция, кварта, квинта, секста, септима, октава.</p>
            <p>Пример: интервал от До до Ми — большая терция (4 полутона).</p>
            <div class="interactive-block">
              <span>Послушай терцию:</span>
              <button class="note-btn" data-interval="C4,E4">▶️ До → Ми</button>
            </div>
            <p>Интервалы бывают мелодические (ноты играются по очереди) и гармонические (одновременно).</p>
          `
        },
        {
          id: 'accidentals',
          title: 'Знаки альтерации',
          icon: '♯',
          content: `
            <p><strong>Диез (♯)</strong> повышает ноту на полтона. <strong>Бемоль (♭)</strong> понижает на полтона. <strong>Бекар (♮)</strong> отменяет предыдущие знаки.</p>
            <p>Пример: нота Фа♯ находится на чёрной клавише между Фа и Соль.</p>
            <div class="interactive-block">
              <span>Сравни Фа и Фа♯:</span>
              <button class="note-btn" data-note="F4">▶️ Фа</button>
              <button class="note-btn" data-note="F#4">▶️ Фа♯</button>
            </div>
            <p>Знаки альтерации действуют до конца такта, если не отменены.</p>
          `
        }
      ];

      // ---- DOM-ссылки ----
      const articleListEl = document.getElementById('articleList');
      const articleContentEl = document.getElementById('articleContent');

      // ---- Аудио ----
      let audioCtx = null;

      function getAudioContext() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playFrequency(freq, duration = 0.5) {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.6, now + 0.05);
        gain.gain.linearRampToValueAtTime(0.3, now + 0.2);
        gain.gain.linearRampToValueAtTime(0, now + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.05);
      }

      const noteFreqs = {
        'C4': 261.63, 'C#4': 277.18, 'D4': 293.66, 'D#4': 311.13,
        'E4': 329.63, 'F4': 349.23, 'F#4': 369.99, 'G4': 392.00,
        'G#4': 415.30, 'A4': 440.00, 'A#4': 466.16, 'B4': 493.88,
        'C5': 523.25
      };

      function playNoteByKey(key) {
        if (noteFreqs[key]) {
          playFrequency(noteFreqs[key]);
        }
      }

      function playInterval(keys) {
        const [key1, key2] = keys.split(',');
        if (noteFreqs[key1] && noteFreqs[key2]) {
          playFrequency(noteFreqs[key1], 0.5);
          setTimeout(() => playFrequency(noteFreqs[key2], 0.5), 600);
        }
      }

      // ---- Отрисовка списка статей ----
      function renderArticleList() {
        articleListEl.innerHTML = articles.map(article => `
          <li class="article-item" data-id="${article.id}">
            <span class="article-icon">${article.icon}</span>
            ${article.title}
          </li>
        `).join('');

        document.querySelectorAll('.article-item').forEach(item => {
          item.addEventListener('click', () => {
            const id = item.dataset.id;
            const article = articles.find(a => a.id === id);
            if (article) {
              showArticle(article);
              document.querySelectorAll('.article-item').forEach(el => el.classList.remove('active'));
              item.classList.add('active');
            }
          });
        });
      }

      // ---- Показ статьи ----
      function showArticle(article) {
        articleContentEl.innerHTML = `
          <h2 class="article-title">${article.title}</h2>
          <div class="article-body">${article.content}</div>
        `;

        // Стандартные кнопки (интервалы, альтерация)
        articleContentEl.querySelectorAll('.note-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const note = btn.dataset.note;
            const interval = btn.dataset.interval;
            if (note) {
              playNoteByKey(note);
            } else if (interval) {
              playInterval(interval);
            }
          });
        });

        // Если статья о нотах – инициализируем пианино и игры
        if (article.id === 'notes') {
          createPiano();
          initGames();
        }
      }

      // ---- СОЗДАНИЕ КЛАВИАТУРЫ С АССОЦИАЦИЯМИ ----
      function createPiano() {
        const container = document.getElementById('piano-container');
        if (!container) return;
        container.innerHTML = '';

        const pianoDiv = document.createElement('div');
        pianoDiv.className = 'piano';
        pianoDiv.id = 'piano-keyboard';

        // Данные о нотах: ключ, подпись, эмодзи, белая ли?
        const notesData = [
          { key: 'C4', label: 'До', emoji: '🏠', white: true },
          { key: 'C#4', label: 'До♯', emoji: '', white: false },
          { key: 'D4', label: 'Ре', emoji: '🌊', white: true },
          { key: 'D#4', label: 'Ре♯', emoji: '', white: false },
          { key: 'E4', label: 'Ми', emoji: '🐻', white: true },
          { key: 'F4', label: 'Фа', emoji: '🔦', white: true },
          { key: 'F#4', label: 'Фа♯', emoji: '', white: false },
          { key: 'G4', label: 'Соль', emoji: '☀️', white: true },
          { key: 'G#4', label: 'Соль♯', emoji: '', white: false },
          { key: 'A4', label: 'Ля', emoji: '🐸', white: true },
          { key: 'A#4', label: 'Ля♯', emoji: '', white: false },
          { key: 'B4', label: 'Си', emoji: '🐦', white: true }
        ];

        notesData.forEach(note => {
          const keyEl = document.createElement('div');
          keyEl.className = note.white ? 'white-key' : 'black-key';
          keyEl.dataset.note = note.key;
          keyEl.dataset.label = note.label.replace('♯', ''); // для сравнения в игре

          if (note.white) {
            // Белая клавиша: показываем эмодзи и название
            const emojiSpan = document.createElement('span');
            emojiSpan.className = 'note-emoji';
            emojiSpan.textContent = note.emoji;
            const labelSpan = document.createElement('span');
            labelSpan.className = 'note-label';
            labelSpan.textContent = note.label;
            keyEl.appendChild(emojiSpan);
            keyEl.appendChild(labelSpan);
          } else {
            // Чёрная клавиша: только подпись
            keyEl.textContent = note.label;
          }

          keyEl.addEventListener('click', (e) => {
            e.stopPropagation();
            playNoteByKey(note.key);
            keyEl.classList.add('active');
            setTimeout(() => keyEl.classList.remove('active'), 200);
            // Если активна игра "Найди ноту" – обрабатываем клик
            if (window.memoryGameActive) {
              handleMemoryClick(note.key, note.label.replace('♯', ''));
            }
          });

          pianoDiv.appendChild(keyEl);
        });

        container.appendChild(pianoDiv);
      }

      // ---- ИГРЫ ----
      let earState = { correct: null, attempts: 0, correctCount: 0, isPlaying: false };
      let memoryState = { currentNote: null, attempts: 0, correctCount: 0, isWaiting: false };

      function initGames() {
        // Переключение вкладок
        document.querySelectorAll('.game-tab').forEach(tab => {
          tab.addEventListener('click', () => {
            document.querySelectorAll('.game-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            const gameId = tab.dataset.game;
            document.querySelectorAll('.game-panel').forEach(p => p.classList.remove('active'));
            document.getElementById('game-' + gameId).classList.add('active');
            // Сброс подсветки клавиш при смене игры
            clearHighlights();
            // Отключаем память
            window.memoryGameActive = false;
          });
        });

        // Инициализация игры "Угадай по звуку"
        const earBtn = document.getElementById('play-random-note');
        const earOptions = document.getElementById('ear-options');
        const earFeedback = document.getElementById('ear-feedback');
        const earScore = document.getElementById('ear-score');

        earState.attempts = 0;
        earState.correctCount = 0;
        updateEarScore();

        earBtn.addEventListener('click', () => {
          if (earState.isPlaying) return;
          startEarRound();
        });

        function startEarRound() {
          earState.isPlaying = true;
          earFeedback.textContent = '🎧 Слушай...';
          earFeedback.style.color = '#cfc0f0';
          earOptions.innerHTML = '';
          earBtn.disabled = true;
          earBtn.style.opacity = '0.6';

          const whiteNotes = [
            { key: 'C4', label: 'До', emoji: '🏠' },
            { key: 'D4', label: 'Ре', emoji: '🌊' },
            { key: 'E4', label: 'Ми', emoji: '🐻' },
            { key: 'F4', label: 'Фа', emoji: '🔦' },
            { key: 'G4', label: 'Соль', emoji: '☀️' },
            { key: 'A4', label: 'Ля', emoji: '🐸' },
            { key: 'B4', label: 'Си', emoji: '🐦' }
          ];
          const randomIndex = Math.floor(Math.random() * whiteNotes.length);
          const selected = whiteNotes[randomIndex];
          earState.correct = selected.label;

          playNoteByKey(selected.key);

          // Варианты ответов (все 7 нот, но показываем 4)
          const allLabels = whiteNotes.map(n => n.label);
          let options = [selected.label];
          while (options.length < 4) {
            const rand = allLabels[Math.floor(Math.random() * allLabels.length)];
            if (!options.includes(rand)) {
              options.push(rand);
            }
          }
          options = shuffleArray(options);

          options.forEach(label => {
            const btn = document.createElement('button');
            btn.className = 'game-option';
            btn.textContent = label;
            btn.dataset.label = label;
            btn.addEventListener('click', () => handleEarOption(btn, label));
            earOptions.appendChild(btn);
          });

          setTimeout(() => {
            earBtn.disabled = false;
            earBtn.style.opacity = '1';
            earState.isPlaying = false;
            earFeedback.textContent = '👆 Выбери правильный вариант!';
          }, 400);
        }

        function handleEarOption(btn, selectedLabel) {
          if (earState.isPlaying) return;
          if (btn.classList.contains('disabled')) return;

          const correct = earState.correct;
          const allOptions = document.querySelectorAll('#ear-options .game-option');
          allOptions.forEach(b => b.classList.add('disabled'));

          earState.attempts++;
          if (selectedLabel === correct) {
            earState.correctCount++;
            btn.classList.add('correct');
            earFeedback.textContent = '✅ Правильно! Молодец! 🎉';
            earFeedback.style.color = '#6fcf97';
          } else {
            btn.classList.add('wrong');
            allOptions.forEach(b => {
              if (b.dataset.label === correct) {
                b.classList.add('correct');
              }
            });
            earFeedback.textContent = `❌ Неверно! Правильный ответ – «${correct}».`;
            earFeedback.style.color = '#eb5757';
          }
          updateEarScore();

          setTimeout(() => {
            allOptions.forEach(b => b.classList.remove('disabled', 'correct', 'wrong'));
            earOptions.innerHTML = '';
            earFeedback.textContent = '🎯 Нажми "Сыграть случайную ноту" для следующего раунда.';
            earFeedback.style.color = '#cfc0f0';
          }, 2000);
        }

        function updateEarScore() {
          earScore.textContent = `✅ Правильных: ${earState.correctCount} / ${earState.attempts}`;
        }

        // ---- Игра "Найди ноту" ----
        const memoryShowBtn = document.getElementById('memory-show');
        const memoryPrompt = document.getElementById('memory-prompt');
        const memoryFeedback = document.getElementById('memory-feedback');
        const memoryScore = document.getElementById('memory-score');

        memoryState.attempts = 0;
        memoryState.correctCount = 0;
        updateMemoryScore();
        window.memoryGameActive = false;

        const whiteNotesMemory = [
          { key: 'C4', label: 'До', emoji: '🏠' },
          { key: 'D4', label: 'Ре', emoji: '🌊' },
          { key: 'E4', label: 'Ми', emoji: '🐻' },
          { key: 'F4', label: 'Фа', emoji: '🔦' },
          { key: 'G4', label: 'Соль', emoji: '☀️' },
          { key: 'A4', label: 'Ля', emoji: '🐸' },
          { key: 'B4', label: 'Си', emoji: '🐦' }
        ];

        memoryShowBtn.addEventListener('click', () => {
          if (memoryState.isWaiting) return;
          startMemoryRound();
        });

        function startMemoryRound() {
          memoryState.isWaiting = true;
          memoryShowBtn.disabled = true;
          memoryFeedback.textContent = '👀 Запомни ноту и нажми на клавишу!';
          memoryFeedback.style.color = '#cfc0f0';
          clearHighlights();
          window.memoryGameActive = true;

          const randomIndex = Math.floor(Math.random() * whiteNotesMemory.length);
          const selected = whiteNotesMemory[randomIndex];
          memoryState.currentNote = selected;

          // Показываем ноту с эмодзи
          memoryPrompt.innerHTML = `<span class="emoji-big">${selected.emoji}</span> ${selected.label}`;

          // Через небольшую паузу разрешаем клики
          setTimeout(() => {
            memoryShowBtn.disabled = false;
            memoryState.isWaiting = false;
          }, 300);
        }

        function handleMemoryClick(key, label) {
          if (memoryState.isWaiting) return;
          if (!memoryState.currentNote) return;
          if (window.memoryGameActive === false) return;

          const correctLabel = memoryState.currentNote.label;
          const correctKey = memoryState.currentNote.key;

          // Находим клавиши
          const allKeys = document.querySelectorAll('#piano-keyboard .white-key, #piano-keyboard .black-key');
          let clickedEl = null;
          allKeys.forEach(el => {
            if (el.dataset.note === key) clickedEl = el;
          });

          // Сброс подсветки
          clearHighlights();

          memoryState.attempts++;
          if (label === correctLabel) {
            memoryState.correctCount++;
            if (clickedEl) clickedEl.classList.add('highlight-correct');
            memoryFeedback.textContent = '✅ Правильно! Отлично! 🎉';
            memoryFeedback.style.color = '#6fcf97';
          } else {
            if (clickedEl) clickedEl.classList.add('highlight-wrong');
            // Показываем правильную клавишу
            allKeys.forEach(el => {
              if (el.dataset.note === correctKey) {
                el.classList.add('highlight-correct');
              }
            });
            memoryFeedback.textContent = `❌ Неверно! Правильная клавиша – «${correctLabel}» ${memoryState.currentNote.emoji}`;
            memoryFeedback.style.color = '#eb5757';
          }
          updateMemoryScore();
          window.memoryGameActive = false;

          // Через 2 секунды сбрасываем подсветку и готовим следующий раунд
          setTimeout(() => {
            clearHighlights();
            memoryPrompt.innerHTML = '🎯 Нажми «Показать ноту» для следующей';
            memoryFeedback.textContent = '🔄 Готов? Жми кнопку!';
            memoryFeedback.style.color = '#cfc0f0';
            memoryState.currentNote = null;
          }, 2000);
        }

        function clearHighlights() {
          document.querySelectorAll('.white-key, .black-key').forEach(el => {
            el.classList.remove('highlight-correct', 'highlight-wrong');
          });
        }

        function updateMemoryScore() {
          memoryScore.textContent = `✅ Правильных: ${memoryState.correctCount} / ${memoryState.attempts}`;
        }

        function shuffleArray(arr) {
          for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
          }
          return arr;
        }

        // Инициализация: по умолчанию активна игра "Угадай"
        window.memoryGameActive = false;
      }

      // ---- Инициализация приложения ----
      renderArticleList();
      // Показываем первую статью (ноты)
      if (articles.length > 0) {
        const firstItem = document.querySelector('.article-item');
        if (firstItem) firstItem.click();
      }
    })();
  </script>
</body>
</html>
