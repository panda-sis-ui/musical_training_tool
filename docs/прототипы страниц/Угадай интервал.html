<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=1.5">
  <title>Угадай интервал | Сольфеджио-тренажёр</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at 20% 20%, #3b2b5e, #1b1236);
      font-family: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #f5f0ff;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    .header {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.9rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }

    .logo {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #f9d56e, #ffb347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .logo span {
      font-size: 1.9rem;
      filter: drop-shadow(0 0 8px #ffb347);
    }

    .nav {
      display: flex;
      gap: 2rem;
      font-weight: 600;
      flex-wrap: wrap;
    }

    .nav a {
      color: #cfc0f0;
      text-decoration: none;
      padding: 0.3rem 0;
      border-bottom: 2px solid transparent;
      transition: 0.2s ease;
    }

    .nav a:hover {
      border-bottom-color: #ffb347;
      color: #fff;
    }

    .game-container {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
      padding: 1rem 1rem 2rem;
    }

    /* Человечек в левом верхнем углу */
    .listener-corner {
      position: absolute;
      top: 0.5rem;
      left: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      cursor: pointer;
      z-index: 5;
      transition: transform 0.2s;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.4));
    }

    .listener-corner:hover {
      transform: scale(1.05);
    }

    .listener-corner:active {
      transform: scale(0.96);
    }

    .listener-avatar {
      font-size: 4rem;
      line-height: 1;
      animation: gentleBob 2s infinite alternate ease-in-out;
    }

    @keyframes gentleBob {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    .listener-label {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      color: #ffe5b4;
      font-weight: 700;
      font-size: 0.9rem;
      padding: 0.3rem 1rem;
      border-radius: 30px;
      white-space: nowrap;
      border: 1px solid rgba(255, 200, 100, 0.4);
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }

    /* Кнопка Подсказка в правом нижнем углу */
    .hint-btn {
      position: absolute;
      bottom: 0.8rem;
      right: 0.8rem;
      background: #f9d56e;
      border: none;
      border-radius: 40px;
      padding: 0.6rem 1.5rem;
      font-weight: 700;
      font-size: 1rem;
      color: #1b1236;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 0.4rem;
      z-index: 6;
      transition: 0.2s;
      border: 2px solid #ffb347;
    }

    .hint-btn:hover {
      background: #ffe8a1;
      transform: translateY(-3px);
    }

    .hint-btn:active {
      transform: translateY(1px);
    }

    /* Облака и знак вопроса */
    .cloud-area {
      position: relative;
      width: 300px;
      height: 200px;
      margin: 2rem auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .cloud {
      position: absolute;
      background: #ffffff;
      border-radius: 80% 20% 70% 30% / 60% 50% 50% 40%;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.4), inset 0 -8px 12px rgba(0, 0, 0, 0.1);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .cloud::after,
    .cloud::before {
      content: '';
      position: absolute;
      background: inherit;
      border-radius: inherit;
    }

    .cloud1 {
      width: 170px;
      height: 95px;
      top: 15px;
      left: 15px;
      z-index: 2;
      animation: floatCloud 5s infinite alternate ease-in-out;
    }

    .cloud2 {
      width: 150px;
      height: 85px;
      bottom: 10px;
      right: 0;
      z-index: 2;
      animation: floatCloud 6s infinite alternate-reverse ease-in-out;
    }

    .cloud3 {
      width: 130px;
      height: 70px;
      top: 55px;
      right: 30px;
      z-index: 1;
      opacity: 0.9;
      animation: floatCloud 7s infinite alternate ease-in-out;
    }

    @keyframes floatCloud {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-15px) scale(1.04); }
    }

    .question-mark {
      font-size: 5rem;
      font-weight: 900;
      color: #ffd966;
      text-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
      z-index: 3;
      position: relative;
      animation: gentlePulse 2s infinite alternate;
      line-height: 1;
      transition: color 0.4s;
    }

    @keyframes gentlePulse {
      0% { transform: scale(1); opacity: 0.9; }
      100% { transform: scale(1.08); opacity: 1; }
    }

    /* Клавиатура */
    .piano-wrapper {
      background: #2a213a;
      padding: 1.5rem 0.8rem 1rem;
      border-radius: 2.5rem;
      box-shadow: 0 25px 40px rgba(0, 0, 0, 0.6), inset 0 0 12px rgba(255, 255, 255, 0.1);
      margin: 1rem 0 0.8rem;
      width: 100%;
      position: relative;
    }

    .piano {
      display: flex;
      position: relative;
      height: 160px;
      justify-content: center;
      width: 100%;
    }

    .white-key {
      flex: 1 1 0;
      background: linear-gradient(180deg, #fefcf5 0%, #e8e0d5 100%);
      border-radius: 0 0 14px 14px;
      margin: 0 1px;
      box-shadow: 0 8px 0 #b7a99a, 0 10px 12px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 10px;
      font-weight: bold;
      color: #3b3347;
      font-size: 1rem;
      transition: all 0.08s ease;
      position: relative;
      z-index: 2;
      min-width: 0;
    }

    .white-key:active,
    .white-key.pressed {
      box-shadow: 0 3px 0 #b7a99a, 0 6px 8px rgba(0, 0, 0, 0.3);
      background: #f3e9da;
      transform: translateY(5px);
    }

    /* Подсветка тоники и второй ноты */
    .white-key.tonic-highlight,
    .black-key.tonic-highlight {
      background: #fff9c4;
      box-shadow: 0 0 15px #ffb300;
    }

    .white-key.interval-highlight,
    .black-key.interval-highlight {
      background: #ffccbc;
      box-shadow: 0 0 15px #ff5722;
    }

    .hint-group {
      animation: hintGroupGlow 0.9s ease-in-out 2;
    }

    .white-key.hint-group {
      background: #fff3cd;
      box-shadow: 0 0 20px #ffc107;
    }

    .black-key.hint-group {
      background: #5c4a3a;
      box-shadow: 0 0 20px #ffc107;
    }

    @keyframes hintGroupGlow {
      0% { box-shadow: 0 0 10px #ffb347; }
      50% { box-shadow: 0 0 30px #ff9100; }
      100% { box-shadow: 0 0 10px #ffb347; }
    }

    .black-key {
      position: absolute;
      width: 7%;
      height: 60%;
      background: linear-gradient(180deg, #2f2f3a 0%, #0f0f14 100%);
      border-radius: 0 0 8px 8px;
      box-shadow: 0 6px 0 #050507, 0 8px 10px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      z-index: 3;
      transition: all 0.08s ease;
      min-width: 30px;
    }

    .black-key:active,
    .black-key.pressed {
      box-shadow: 0 2px 0 #050507, 0 4px 6px rgba(0, 0, 0, 0.5);
      transform: translateY(4px);
      background: #3d3d4a;
    }

    .piano-labels {
      text-align: center;
      margin-top: 0.8rem;
      font-size: 0.8rem;
      color: #b9adcc;
    }

    /* Кнопки интервалов */
    .interval-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
      margin: 0.5rem 0;
    }

    .interval-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 200, 100, 0.3);
      border-radius: 2rem;
      padding: 0.7rem 1.2rem;
      font-weight: 700;
      font-size: 0.95rem;
      color: #f5f0ff;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .interval-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: #ffb347;
      transform: translateY(-2px);
    }

    .interval-btn:active {
      transform: translateY(1px);
    }

    .info-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.8rem;
      width: 100%;
    }

    .hint-text {
      background: rgba(0, 0, 0, 0.4);
      padding: 0.6rem 1.8rem;
      border-radius: 40px;
      font-size: 1.2rem;
      font-weight: 600;
      backdrop-filter: blur(8px);
      color: #ffe5b4;
      border: 1px solid rgba(255, 200, 100, 0.3);
    }

    .feedback {
      height: 2.5rem;
      font-size: 1.4rem;
      font-weight: bold;
      text-align: center;
    }

    .btn-new-game {
      background: #ffb347;
      border: none;
      color: #1b1236;
      font-weight: bold;
      padding: 0.8rem 2.2rem;
      border-radius: 3rem;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 12px 18px rgba(0, 0, 0, 0.3);
      transition: 0.2s;
      margin-top: 0.3rem;
    }

    .btn-new-game:hover {
      background: #ffc164;
      transform: translateY(-2px);
    }

    .btn-new-game:active {
      transform: translateY(2px);
    }

    @media (max-width: 650px) {
      .listener-corner {
        top: 0.2rem;
        left: 0.3rem;
      }
      .listener-avatar {
        font-size: 3rem;
      }
      .listener-label {
        font-size: 0.7rem;
        padding: 0.2rem 0.7rem;
      }
      .hint-btn {
        padding: 0.4rem 1.2rem;
        font-size: 0.8rem;
        bottom: 0.5rem;
        right: 0.5rem;
      }
      .question-mark {
        font-size: 3.5rem;
      }
      .cloud-area {
        width: 240px;
        height: 160px;
      }
      .cloud1 { width: 120px; height: 70px; }
      .cloud2 { width: 100px; height: 60px; }
      .cloud3 { width: 90px; height: 50px; }
      .white-key { font-size: 0.7rem; padding-bottom: 4px; }
      .piano { height: 130px; }
      .black-key { width: 8%; }
    }

    @media (max-width: 400px) {
      .piano { height: 110px; }
      .white-key { font-size: 0.6rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">
      <span>🎼</span> Сольфеджио-тренажёр
    </div>
    <nav class="nav">
      <a href="#">Главная</a>
      <a href="#">Тренажёры</a>
      <a href="#">Статьи</a>
      <a href="#">О проекте</a>
    </nav>
  </header>

  <div class="game-container">
    <div class="listener-corner" id="listenerCorner">
      <div class="listener-avatar">🧑‍🎤</div>
      <div class="listener-label">Послушай интервал</div>
    </div>

    <button class="hint-btn" id="hintBtn">💡 Подсказка</button>

    <div class="cloud-area" id="cloudArea">
      <div class="cloud cloud1"></div>
      <div class="cloud cloud2"></div>
      <div class="cloud cloud3"></div>
      <div class="question-mark" id="questionMark">?</div>
    </div>

    <div class="piano-wrapper">
      <div class="piano" id="piano"></div>
      <div class="piano-labels" id="pianoLabels"></div>
    </div>

    <!-- Кнопки интервалов - всегда отображаются все -->
    <div class="interval-buttons" id="intervalButtons">
      <button class="interval-btn">Прима</button>
      <button class="interval-btn">Секунда</button>
      <button class="interval-btn">Терция</button>
      <button class="interval-btn">Кварта</button>
      <button class="interval-btn">Квинта</button>
      <button class="interval-btn">Секста</button>
      <button class="interval-btn">Септима</button>
      <button class="interval-btn">Октава</button>
    </div>

    <div class="info-area">
      <div class="hint-text" id="hintText">🎯 Нажми на человечка и угадай интервал</div>
      <div class="feedback" id="feedback"></div>
      <button class="btn-new-game" id="newGameBtn">🔄 Новый интервал</button>
    </div>
  </div>

  <script>
    (function() {
      const NOTES = [
        { name: 'До', octave: 4, freq: 261.63, key: 'C4', isBlack: false },
        { name: 'До♯', octave: 4, freq: 277.18, key: 'C#4', isBlack: true },
        { name: 'Ре', octave: 4, freq: 293.66, key: 'D4', isBlack: false },
        { name: 'Ре♯', octave: 4, freq: 311.13, key: 'D#4', isBlack: true },
        { name: 'Ми', octave: 4, freq: 329.63, key: 'E4', isBlack: false },
        { name: 'Фа', octave: 4, freq: 349.23, key: 'F4', isBlack: false },
        { name: 'Фа♯', octave: 4, freq: 369.99, key: 'F#4', isBlack: true },
        { name: 'Соль', octave: 4, freq: 392.00, key: 'G4', isBlack: false },
        { name: 'Соль♯', octave: 4, freq: 415.30, key: 'G#4', isBlack: true },
        { name: 'Ля', octave: 4, freq: 440.00, key: 'A4', isBlack: false },
        { name: 'Ля♯', octave: 4, freq: 466.16, key: 'A#4', isBlack: true },
        { name: 'Си', octave: 4, freq: 493.88, key: 'B4', isBlack: false },
        { name: 'До', octave: 5, freq: 523.25, key: 'C5', isBlack: false },
        { name: 'До♯', octave: 5, freq: 554.37, key: 'C#5', isBlack: true },
        { name: 'Ре', octave: 5, freq: 587.33, key: 'D5', isBlack: false },
        { name: 'Ре♯', octave: 5, freq: 622.25, key: 'D#5', isBlack: true },
        { name: 'Ми', octave: 5, freq: 659.25, key: 'E5', isBlack: false },
        { name: 'Фа', octave: 5, freq: 698.46, key: 'F5', isBlack: false },
        { name: 'Фа♯', octave: 5, freq: 739.99, key: 'F#5', isBlack: true },
        { name: 'Соль', octave: 5, freq: 783.99, key: 'G5', isBlack: false },
        { name: 'Соль♯', octave: 5, freq: 830.61, key: 'G#5', isBlack: true },
        { name: 'Ля', octave: 5, freq: 880.00, key: 'A5', isBlack: false },
        { name: 'Ля♯', octave: 5, freq: 932.33, key: 'A#5', isBlack: true },
        { name: 'Си', octave: 5, freq: 987.77, key: 'B5', isBlack: false }
      ];

      // Интервалы (полутоны)
      const INTERVALS = [
        { name: 'Прима', semitones: 0 },
        { name: 'Секунда', semitones: 2 },
        { name: 'Терция', semitones: 4 },
        { name: 'Кварта', semitones: 5 },
        { name: 'Квинта', semitones: 7 },
        { name: 'Секста', semitones: 9 },
        { name: 'Септима', semitones: 11 },
        { name: 'Октава', semitones: 12 }
      ];

      const pianoContainer = document.getElementById('piano');
      const labelsContainer = document.getElementById('pianoLabels');
      const questionMark = document.getElementById('questionMark');
      const cloudArea = document.getElementById('cloudArea');
      const listenerCorner = document.getElementById('listenerCorner');
      const hintText = document.getElementById('hintText');
      const feedbackDiv = document.getElementById('feedback');
      const newGameBtn = document.getElementById('newGameBtn');
      const hintBtn = document.getElementById('hintBtn');

      let currentInterval = null;
      let audioCtx = null;
      let gameActive = true;

      // ---------- Аудио ----------
      function getAudioContext() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        return audioCtx;
      }

      function playFrequency(freq, duration = 0.5) {
        const ctx = getAudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.6, now + 0.06);
        gain.gain.linearRampToValueAtTime(0.4, now + 0.2);
        gain.gain.linearRampToValueAtTime(0, now + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.05);
      }

      function playIntervalNotes(rootNote, secondNote) {
        playFrequency(rootNote.freq, 0.6);
        setTimeout(() => {
          playFrequency(secondNote.freq, 0.6);
        }, 700);
      }

      function playCurrentInterval() {
        if (currentInterval) {
          const rootNote = NOTES[currentInterval.rootIndex];
          const secondNote = NOTES[currentInterval.secondIndex];
          playIntervalNotes(rootNote, secondNote);
          hintText.textContent = `🎵 Послушай ещё раз`;
        }
      }

      // ---------- Генерация интервала ----------
      function generateInterval() {
        const maxRootIndex = NOTES.length - 13;
        const rootIndex = Math.floor(Math.random() * (maxRootIndex + 1));
        const intervalObj = INTERVALS[Math.floor(Math.random() * INTERVALS.length)];
        const secondIndex = rootIndex + intervalObj.semitones;
        return {
          rootIndex,
          secondIndex,
          intervalName: intervalObj.name,
          intervalObj
        };
      }

      // ---------- Клавиатура ----------
      function renderPiano() {
        pianoContainer.innerHTML = '';
        const whiteKeysData = NOTES.filter(n => !n.isBlack);
        whiteKeysData.forEach(note => {
          const keyDiv = document.createElement('div');
          keyDiv.className = 'white-key';
          keyDiv.dataset.noteIndex = NOTES.indexOf(note);
          keyDiv.dataset.noteData = JSON.stringify({ isBlack: note.isBlack, octave: note.octave, name: note.name });
          keyDiv.textContent = note.name;
          keyDiv.addEventListener('click', () => {
            playFrequency(note.freq, 0.2);
          });
          pianoContainer.appendChild(keyDiv);
        });

        const blackPositions = {
          'C#4': 0, 'D#4': 1, 'F#4': 3, 'G#4': 4, 'A#4': 5,
          'C#5': 7, 'D#5': 8, 'F#5': 10, 'G#5': 11, 'A#5': 12
        };
        const whiteKeyElements = document.querySelectorAll('.white-key');
        NOTES.filter(n => n.isBlack).forEach(note => {
          const posIndex = blackPositions[note.key];
          if (posIndex !== undefined && whiteKeyElements[posIndex]) {
            const whiteKey = whiteKeyElements[posIndex];
            const blackKey = document.createElement('div');
            blackKey.className = 'black-key';
            blackKey.dataset.noteIndex = NOTES.indexOf(note);
            blackKey.dataset.noteData = JSON.stringify({ isBlack: note.isBlack, octave: note.octave, name: note.name });
            blackKey.addEventListener('click', (e) => {
              e.stopPropagation();
              playFrequency(note.freq, 0.2);
            });
            pianoContainer.appendChild(blackKey);
            positionBlackKey(blackKey, whiteKey);
          }
        });

        labelsContainer.textContent = 'До малой октавы – Си второй октавы';
      }

      function positionBlackKey(blackKey, whiteKey) {
        const whiteRect = whiteKey.getBoundingClientRect();
        const pianoRect = pianoContainer.getBoundingClientRect();
        const leftOffset = whiteRect.left - pianoRect.left + whiteRect.width * 0.7;
        blackKey.style.left = `${leftOffset}px`;
        blackKey.style.width = `${whiteRect.width * 0.55}px`;
      }

      function repositionAllBlackKeys() {
        const blackKeys = document.querySelectorAll('.black-key');
        const whiteKeyElements = document.querySelectorAll('.white-key');
        const blackPositions = {
          'C#4': 0, 'D#4': 1, 'F#4': 3, 'G#4': 4, 'A#4': 5,
          'C#5': 7, 'D#5': 8, 'F#5': 10, 'G#5': 11, 'A#5': 12
        };
        blackKeys.forEach(key => {
          const noteIndex = parseInt(key.dataset.noteIndex);
          const note = NOTES[noteIndex];
          const posIndex = blackPositions[note.key];
          if (posIndex !== undefined && whiteKeyElements[posIndex]) {
            positionBlackKey(key, whiteKeyElements[posIndex]);
          }
        });
      }

      window.addEventListener('resize', repositionAllBlackKeys);

      function clearHighlights() {
        document.querySelectorAll('.white-key, .black-key').forEach(el => {
          el.classList.remove('tonic-highlight', 'interval-highlight', 'hint-group');
        });
      }

      function highlightNotes(rootIndex, secondIndex) {
        clearHighlights();
        const rootEl = document.querySelector(`[data-note-index="${rootIndex}"]`);
        const secondEl = document.querySelector(`[data-note-index="${secondIndex}"]`);
        if (rootEl) rootEl.classList.add('tonic-highlight');
        if (secondEl) secondEl.classList.add('interval-highlight');
      }

      // ---------- Обработка ответов ----------
      function setupIntervalButtons() {
        const buttons = document.querySelectorAll('.interval-btn');
        buttons.forEach(btn => {
          btn.addEventListener('click', () => {
            if (!gameActive) return;
            const selected = btn.textContent;
            const correctName = currentInterval.intervalName;
            if (selected === correctName) {
              gameActive = false;
              feedbackDiv.innerHTML = '✅ Верно! Молодец!';
              feedbackDiv.style.color = '#b7f7b0';
              questionMark.textContent = correctName;
              questionMark.style.color = '#a5f2a0';
              cloudArea.style.transform = 'scale(0.9)';
              hintText.textContent = `🎉 Правильно! Это ${correctName}`;
              document.querySelectorAll('.cloud').forEach(c => c.style.opacity = '0.3');
              highlightNotes(currentInterval.rootIndex, currentInterval.secondIndex);
            } else {
              feedbackDiv.innerHTML = '❌ Мимо! Попробуй ещё';
              feedbackDiv.style.color = '#ffb0b0';
              cloudArea.style.transform = 'translateX(8px)';
              setTimeout(() => cloudArea.style.transform = '', 200);
              hintText.textContent = '🙁 Неправильно, попробуй другой вариант';
            }
          });
        });
      }

      function showHint() {
        if (!gameActive || !currentInterval) return;
        clearHighlights();
        const rootNote = NOTES[currentInterval.rootIndex];
        const rootEl = document.querySelector(`[data-note-index="${currentInterval.rootIndex}"]`);
        if (rootEl) rootEl.classList.add('hint-group');
        hintText.textContent = `💡 Первая нота: ${rootNote.name.replace('♯', '♯')}`;
      }

      function newGame() {
        currentInterval = generateInterval();
        gameActive = true;
        questionMark.textContent = '?';
        questionMark.style.color = '#ffd966';
        feedbackDiv.innerHTML = '';
        cloudArea.style.transform = '';
        document.querySelectorAll('.cloud').forEach(c => c.style.opacity = '');
        clearHighlights();
        hintText.textContent = '🎯 Нажми на человечка и угадай интервал';
      }

      function init() {
        renderPiano();
        newGame();
        setupIntervalButtons();

        listenerCorner.addEventListener('click', playCurrentInterval);
        cloudArea.addEventListener('click', playCurrentInterval);
        newGameBtn.addEventListener('click', newGame);
        hintBtn.addEventListener('click', showHint);
        setTimeout(repositionAllBlackKeys, 100);
      }

      init();
    })();
  </script>
</body>
</html>
